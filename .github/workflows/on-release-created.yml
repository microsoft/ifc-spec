# Creates a release branch whenever a release is created.

name: On Release Created
on:
  release:
    types:
      - published

jobs:
  create_branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Note: Needed in order to generate a tag on the associated commit.
    steps:
      - uses: peterjgrainger/action-create-branch@b48b0ca0e307c9b56f059b70274984ffeaa90a43 # v2.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: 'release/${{ github.event.release.tag_name }}'

  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Compile document
        uses: xu-cheng/latex-action@8c9adec310ed05afa3650bd2727d1e71ca1dfd0d # 2.8.2
        with:
          root_file: ifc.tex
          working_directory: ltx

      - name: Add PDF to Release
        uses: softprops/action-gh-release@6034af24fba4e5a8e975aaa6056554efe4c794d0 # v0.1.13
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ltx/ifc.pdf
